# File: dependabot.yml
# Purpose: Open small, scheduled dependency updates across every package ecosystem in this repository.
# Groups: Maven, npm, Docker, and GitHub Actions are checked weekly with bounded open requests.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
