# File: native-application.yml
# Purpose: Build a genuine bundled Windows app and test actual EXE/UI/durable restart in isolated synthetic profiles.
# State: source read only; optional manual package artifact, no tag/release or computer installation.
name: Native application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      retain-package:
        description: Retain the unsigned Windows app-image as a short-lived artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Bundled Windows application acceptance
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up build-only Java21 toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.13+9"
          check-latest: true
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Set up build-only Node24 toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm --prefix frontend ci
      - name: Run original Java and browser-code verification
        shell: pwsh
        run: |
          & backend/mvnw.cmd -f backend/pom.xml --batch-mode --no-transfer-progress clean verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend run verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact Chromium for acceptance
        timeout-minutes: 5
        working-directory: frontend
        run: npx playwright install chromium
      - name: Build fresh app-image with embedded provenance and Java runtime
        shell: pwsh
        run: ./scripts/build-native.ps1
      - name: Exercise actual bundled EXE, UI, export, restrictions and durable restart
        timeout-minutes: 5
        run: node scripts/native-acceptance.mjs release/windows/IntegrationOperationsConsole/IntegrationOperationsConsole.exe artifacts/native
      - name: Ensure source and generated contracts are unchanged
        run: git diff --exit-code
      - name: Retain bounded public acceptance receipt and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-acceptance
          path: artifacts/native
          retention-days: 3
          if-no-files-found: error
      - name: Retain explicitly requested unsigned app-image
        if: github.event_name == 'workflow_dispatch' && inputs.retain-package && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-operations-console-windows-1.1.0
          path: release/windows/IntegrationOperationsConsole
          retention-days: 3
          if-no-files-found: error
