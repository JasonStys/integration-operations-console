# File: compose.yaml
# Purpose: Run the web console, API, and durable PostgreSQL store as one local stack.
# Services: web proxies /api to api; api migrates and uses db; db persists named-volume data.
name: integration-operations-console

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: operations
      POSTGRES_PASSWORD: operations-local-only
      POSTGRES_USER: operations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operations -d operations"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - operations-data:/var/lib/postgresql/data

  api:
    build:
      context: backend
    environment:
      IOC_ALLOWED_ORIGIN: http://localhost:8081
      IOC_DATABASE_PASSWORD: operations-local-only
      IOC_DATABASE_URL: jdbc:postgresql://db:5432/operations
      IOC_DATABASE_USERNAME: operations
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  operations-data:
