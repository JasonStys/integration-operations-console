# File: application.yml
# Purpose: Safe local defaults plus environment-controlled PostgreSQL settings.
# Variables: IOC_DATABASE_* configure the durable store; IOC_ALLOWED_ORIGIN
# limits browser access; management exposure is intentionally read-only.
spring:
  application:
    name: integration-operations-console
  datasource:
    url: ${IOC_DATABASE_URL:jdbc:h2:mem:operations;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${IOC_DATABASE_USERNAME:sa}
    password: ${IOC_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${IOC_DATABASE_POOL_SIZE:10}
      minimum-idle: 1
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${IOC_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

operations:
  allowed-origin: ${IOC_ALLOWED_ORIGIN:http://localhost:5173}
